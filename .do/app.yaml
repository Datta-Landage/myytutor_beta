name: myytutor-backend
region: blr
services:
  - name: backend
    github:
      repo: Datta-Landage/myytutor_beta
      branch: main
      deploy_on_push: true
    build_command: mvn clean package -DskipTests
    run_command: java -jar target/myytutor-0.0.1-SNAPSHOT.jar
    dockerfile_path: Dockerfile
    source_dir: /
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /actuator/health
      initial_delay_seconds: 60
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      # Database Configuration (DigitalOcean Managed Database)
      - key: DB_HOST
        scope: RUN_TIME
        type: SECRET
      - key: DB_PORT
        scope: RUN_TIME
        value: "25060"
      - key: DB_NAME
        scope: RUN_TIME
        value: "myytutor"
      - key: DB_USER
        scope: RUN_TIME
        type: SECRET
      - key: DB_PASSWORD
        scope: RUN_TIME
        type: SECRET
      
      # JWT Configuration
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: JWT_TOKEN_VALIDITY
        scope: RUN_TIME
        value: "86400000"
      
      # Email Configuration
      - key: MAIL_HOST
        scope: RUN_TIME
        value: "smtp.gmail.com"
      - key: MAIL_PORT
        scope: RUN_TIME
        value: "587"
      - key: MAIL_USERNAME
        scope: RUN_TIME
        type: SECRET
      - key: MAIL_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: MAIL_SMTP_AUTH
        scope: RUN_TIME
        value: "true"
      - key: MAIL_SMTP_SSL_ENABLE
        scope: RUN_TIME
        value: "false"
      - key: MAIL_SMTP_STARTTLS_ENABLE
        scope: RUN_TIME
        value: "true"
      
      # Frontend Secret
      - key: FRONTEND_SECRET
        scope: RUN_TIME
        type: SECRET
      
      # Google API
      - key: GOOGLE_API_KEY
        scope: RUN_TIME
        type: SECRET
      
      # Twilio Configuration
      - key: TWILIO_ACCOUNT_SID
        scope: RUN_TIME
        type: SECRET
      - key: TWILIO_AUTH_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: TWILIO_WHATSAPP_FROM
        scope: RUN_TIME
        value: "whatsapp:+14155238886"
      - key: TWILIO_ADMIN_NUMBER
        scope: RUN_TIME
        value: "whatsapp:+919623947782"
      
      # WhatsApp Business API Configuration
      - key: WHATSAPP_PHONE_NUMBER_ID
        scope: RUN_TIME
        type: SECRET
      - key: WHATSAPP_ACCESS_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: WHATSAPP_ADMIN_PHONE
        scope: RUN_TIME
        value: "919623947782"
      - key: WHATSAPP_COMMUNITY_ID
        scope: RUN_TIME
        type: SECRET
      - key: WHATSAPP_VERIFY_TOKEN
        scope: RUN_TIME
        type: SECRET
