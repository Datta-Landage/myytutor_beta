# =====================================================
# APPLICATION
# =====================================================
spring.application.name=MyyTutor
spring.profiles.active=prod

# =====================================================
# DATASOURCE (PRODUCTION)
# =====================================================
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# =====================================================
# HIKARI CP (PRODUCTION TUNED)
# =====================================================
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=20000

# =====================================================
# JPA / HIBERNATE
# =====================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# =====================================================
# FLYWAY (PRODUCTION)
# =====================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.clean-disabled=true

# =====================================================
# LOGGING (NO DATA LEAKS)
# =====================================================
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate=WARN
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.myytutor=INFO

# =====================================================
# ACTUATOR (SAFE)
# =====================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# =====================================================
# CORS (DYNAMIC)
# =====================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
# app props (application.properties)
app.cors.mode=${CORS_MODE:strict}
# =====================================================
# RATE LIMITING (ENFORCED)
# =====================================================
app.rate-limit.ip-check-enabled=${APP_RATE_LIMIT_IP_CHECK_ENABLED}

# =====================================================
# JWT
# =====================================================
jwt.secret=${JWT_SECRET}
jwt.token.validity=${JWT_TOKEN_VALIDITY}

# =====================================================
# FRONTEND SECURITY
# =====================================================
frontend.secret=${FRONTEND_SECRET}

# =====================================================
# MAIL (ZOHO – PROD)
# =====================================================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
mail.from=${MAIL_USERNAME}

# =====================================================
# GOOGLE API
# =====================================================
google.places.api-key=${GOOGLE_API_KEY}
# =====================================================
# OTP
# =====================================================
otp.expiry.minutes=5
otp.max.attempts=3

# =====================================================
# WHATSAPP – META CLOUD API ONLY
# =====================================================
whatsapp.provider=meta
whatsapp.api.url=https://graph.facebook.com/v22.0
whatsapp.phone.number.id=${WHATSAPP_PHONE_NUMBER_ID}
whatsapp.access.token=${WHATSAPP_ACCESS_TOKEN}
whatsapp.admin.phone=${WHATSAPP_ADMIN_PHONE}
whatsapp.verify.token=${WHATSAPP_VERIFY_TOKEN}

# =====================================================
# SECURITY
# =====================================================
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
