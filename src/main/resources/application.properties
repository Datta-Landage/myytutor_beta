spring.application.name=MyyTutor

# DataSource
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Show all errors in console/logs
logging.level.root=INFO
logging.level.org.springframework=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=DEBUG
logging.level.com.myytutor=DEBUG
logging.level.org.springframework.security=TRACE

# Actuator
management.endpoints.web.exposure.include=health,info

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200,http://localhost:8080

# Other (Secrets in ENV)
google.places.api-key=${GOOGLE_API_KEY}
jwt.secret=${JWT_SECRET}
jwt.token.validity=${JWT_TOKEN_VALIDITY}
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
mail.from=${MAIL_USERNAME}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
frontend.secret=${FRONTEND_SECRET}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}

# TEMP: enable debug while testing (remove later)
spring.mail.properties.mail.debug=true
logging.level.org.springframework.mail=DEBUG
logging.level.javax.mail=DEBUG

# OTP Expiry
otp.expiry.minutes=5
# Which provider to use: twilio | meta
whatsapp.provider=twilio

# --- Twilio ---
# Set these in .env.dev file (NOT committed to git)
twilio.account.sid=${TWILIO_ACCOUNT_SID}
twilio.auth.token=${TWILIO_AUTH_TOKEN}
twilio.whatsapp.from=${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}
twilio.admin.number=${TWILIO_ADMIN_NUMBER:whatsapp:+919623947782}

# --- Meta WhatsApp Business Cloud API Configuration ---
# Get these from: https://developers.facebook.com/apps/
whatsapp.api.url=https://graph.facebook.com/v22.0
whatsapp.phone.number.id=${WHATSAPP_PHONE_NUMBER_ID}
whatsapp.access.token=${WHATSAPP_ACCESS_TOKEN}
whatsapp.admin.phone=${WHATSAPP_ADMIN_PHONE:919623947782}
whatsapp.community.id=${WHATSAPP_COMMUNITY_ID}
whatsapp.verify.token=${WHATSAPP_VERIFY_TOKEN:mySecureVerifyToken123}

# Optional strict security: Only accept admin replies from this number
security.admin.whatsapp.e164=+91XXXXXXXXXX

