# H2 Database for testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Dummy values for other properties (still needed for context loading)
GOOGLE_API_KEY=dummy_google_api_key
JWT_SECRET=dummy_jwt_secret_key_for_testing_purposes_only
JWT_TOKEN_VALIDITY=3600

MAIL_HOST=smtp.test.com
MAIL_PORT=587
MAIL_USERNAME=test@test.com
MAIL_PASSWORD=test_password

FRONTEND_SECRET=dummy_frontend_secret