version: '3.8'
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: myytutor
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
  backend:
    build: ./
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/myytutor?useSSL=false&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=rootpassword
      - WHATSAPP_PROVIDER=TWILIO
      - ADMIN_WHATSAPP_NUMBER=+91...
      - TWILIO_ACCOUNT_SID=...
      - TWILIO_AUTH_TOKEN=...
      - TWILIO_PHONE_NUMBER=...
    depends_on:
      - db
volumes:
  db_data:



